name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
      - run: go vet ./...
      - run: go test ./...

  build-binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - binary: agent
            goos: linux
            goarch: amd64
            artifact: agent-linux-amd64
            path: ./cmd/agent
          - binary: agent
            goos: windows
            goarch: amd64
            artifact: agent-windows-amd64.exe
            path: ./cmd/agent
          - binary: server
            goos: linux
            goarch: amd64
            artifact: server-linux-amd64
            path: ./cmd/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
      - run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o dist/${{ matrix.artifact }} ${{ matrix.path }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  build-push-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT || secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        # Set CR_PAT (or GHCR_TOKEN) as a repo secret; falls back to GITHUB_TOKEN.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/selfhosted-gaming-vdi
          tags: |
            type=sha
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=selfhosted-gaming-vdi
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: check-pkg
        run: |
          if [ -f web/package.json ]; then echo "has_pkg=true" >> $GITHUB_OUTPUT; fi
      - if: steps.check-pkg.outputs.has_pkg == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - if: steps.check-pkg.outputs.has_pkg == 'true'
        run: npm ci && npm run build
        working-directory: web
      - if: steps.check-pkg.outputs.has_pkg == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
